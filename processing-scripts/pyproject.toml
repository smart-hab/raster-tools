[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
dependencies = [
    "fastapi>=0.116.0",
    "geopandas>=1.0.1",
    "matplotlib>=3.10.1",
    "python-multipart>=0.0.20",
    "rasterio>=1.4.3",
    "rioxarray>=0.18.2",
    "scikit-learn>=1.6.1",
    "uvicorn>=0.37.0",
]
description = "Assorted tools for processing and visualizing hazardous algae blooms"
name = "smart_hab"
readme = "readme.md"
requires-python = ">=3.12"
version = "0.0.1"

# Dev-only tooling; not installed with the package.
[dependency-groups]
dev = [
    "pyrefly>=0.33.1",
]

[project.scripts]
about = "smart_hab.cli:about"
clip = "smart_hab.cli:clip"
convert_shape = "smart_hab.cli:convert_shape"
equal = "smart_hab.cli:equal"
kmeans_fit = "smart_hab.cli:kmeans_fit"
kmeans_classify = "smart_hab.cli:kmeans_classify"
mask = "smart_hab.cli:mask"
means = "smart_hab.cli:means"
norm_diff = "smart_hab.cli:norm_diff"
plot = "smart_hab.cli:plot"
s2_stack = "smart_hab.cli:s2_stack"
select_bands = "smart_hab.cli:select_bands"
subtract = "smart_hab.cli:subtract"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_hab"]

[tool.pyrefly]
project-includes = ["src/**/*"]

[tool.ruff]
line-length = 100
